spring:
  application:
    name: tripai-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.tripai.backend.domain
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ${TOUR_API_MOBILE_OS:ETC}
  mobile-app: ${TOUR_API_MOBILE_APP:TripAI}

seoul:
  api:
    key: ${SEOUL_CULTURE_API_KEY:}

batch:
  event:
    initial-load: ${BATCH_EVENT_INITIAL_LOAD:false}

# AI 일정 추천 (OpenAI) — 키가 없으면 규칙 기반 추천으로 동작합니다
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
